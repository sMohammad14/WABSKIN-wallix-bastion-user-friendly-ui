<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:'Segoe UI',sans-serif;background:#f4f7f6;padding:20px;direction:ltr}.container{max-width:1450px;margin:auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}.cfg-box{display:flex;gap:10px;background:#f8f9fa;padding:15px;border-radius:8px;margin-bottom:20px;border:1px solid #ddd}.cfg-box input,.field-group input{flex:1;padding:10px;border:1px solid #ced4da;border-radius:6px;font-size:13px;outline:none}.cfg-box input:focus,.field-group input:focus{border-color:#e67e22;box-shadow:0 0 0 3px rgba(230,126,34,0.1)}button{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}.btn-fetch{background:#e67e22;color:#fff;width:100%;margin-bottom:15px}.btn-sync{background:#27ae60;color:#fff;width:100%;font-size:16px;margin-top:20px}.device-card{background:#fff;border:1px solid #e0e0e0;border-left:6px solid transparent;border-radius:12px;margin-bottom:35px;padding:25px;position:relative;box-shadow:0 4px 10px rgba(0,0,0,0.08);border-bottom:3px solid #eee}.mod-card{border-left-color:#e67e22!important;background:#fffdf0!important;border-bottom-color:#f39c12}.card-row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}.field-group{flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px}.field-group label{font-size:13px;font-weight:bold;color:#576574}.label-highlight{color:#e67e22!important;font-size:14px!important}.input-wrap{display:flex;align-items:center;min-height:40px}.rev-btn{width:25px;margin-left:5px;cursor:pointer;color:#e74c3c;font-size:18px;visibility:hidden;user-select:none}.services-area{background:#f1f2f6;padding:15px;border-radius:8px;margin-top:10px}.services-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));grid-auto-flow:dense;gap:15px;margin-top:10px}.service-item{background:#fff;padding:15px;border-radius:8px;border:2px solid #dfe4ea;display:flex;flex-direction:column;justify-content:space-between;height:180px;box-sizing:border-box}.is-large{grid-row:span 2;height:375px}.mod-svc{border-color:#e67e22!important}.service-item.deleted{background:#ffeaa7;border:2px dashed #fdcb6e}.service-item.deleted .content-mask{opacity:0.4;pointer-events:none}.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:5px;background:#f9f9f9;padding:10px;border-radius:4px;border:1px solid #eee}.sub-grid label{font-size:10px;display:grid;grid-template-columns:20px 1fr;align-items:center;gap:4px;cursor:pointer;text-align:left}.sub-grid input{margin:0;cursor:pointer}.logs{background:#2d3436;color:#55efc4;padding:15px;height:180px;overflow-y:auto;border-radius:8px;font-family:monospace;font-size:12px;margin-top:20px}#modal,#add-svc-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000}.modal-content{background:#fff;width:60%;margin:10% auto;padding:25px;border-radius:10px}.svc-info-row{display:flex;justify-content:space-between;background:#f8f9fa;padding:10px;border-radius:6px;margin-bottom:12px;border:1px solid #eee;font-size:12px;color:#2c3e50}.port-input{width:55px!important;flex:none!important}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}select{padding:10px;border:1px solid #ced4da;border-radius:6px;width:100%;background:#fff}.add-btn-small{background:#27ae60;color:#fff;padding:2px 10px;font-size:12px;margin-left:auto;border-radius:4px}</style></head><body><div class="container"><div class="cfg-box"><input id="url" placeholder="https://IP" value="https://"><input id="usr" placeholder="User"><input id="pwd" type="password" placeholder="Pass"></div><button class="btn-fetch" onclick="fetchData()">1. Fetch Devices & Services</button><div id="ui" style="display:none"><div id="device-container"></div><button class="btn-sync" onclick="openReview()">2. Review & Sync</button></div><div class="logs" id="log-box">> System Ready.</div></div><div id="modal"><div class="modal-content"><h3>Confirm Updates</h3><div id="review-list" style="max-height:300px;overflow-y:auto"></div><div style="margin-top:20px;display:flex;gap:10px"><button class="btn-sync" style="margin:0" onclick="processSync()">Confirm</button><button style="background:#95a5a6;color:#fff" onclick="closeModal()">Cancel</button></div></div></div><div id="add-svc-modal"><div class="modal-content" style="width:40%"><h3>Add New Service</h3><div style="display:flex;flex-direction:column;gap:15px"><div class="field-group"><label>1. Select Protocol</label><select id="new-svc-proto" onchange="updateAddModal()"><option value="">-- Select --</option><option value="SSH">SSH</option><option value="RDP">RDP</option><option value="TELNET">TELNET</option><option value="VNC">VNC</option><option value="RAWTCPIP">RAWTCPIP</option><option value="RLOGIN">RLOGIN</option></select></div><div class="field-group"><label>2. Service Name (Unique, No Special Chars)</label><input id="new-svc-name" placeholder="e.g. ssh_admin"></div><div class="field-group"><label>3. Connection Policy</label><select id="new-svc-policy"><option value="">Select Protocol First</option></select></div><div class="field-group"><label>4. Port</label><input type="number" id="new-svc-port"></div></div><div style="margin-top:20px;display:flex;gap:10px"><button class="btn-sync" style="margin:0" onclick="confirmAddService()">Add Service</button><button style="background:#95a5a6;color:#fff" onclick="document.getElementById('add-svc-modal').style.display='none'">Cancel</button></div></div></div><script>let devices=[],original=[],policies=[];let activeDevIdx=-1;const SUB_MAP={'RDP':['RDP_CLIPBOARD_DOWN','RDP_CLIPBOARD_UP','RDP_CLIPBOARD_FILE','RDP_DRIVE','RDP_SMARTCARD','RDP_PRINTER','RDP_COM_PORT','RDP_AUDIO_OUTPUT','RDP_AUDIO_INPUT'],'SSH':['SSH_SHELL_SESSION','SSH_REMOTE_COMMAND','SSH_SCP_DOWN','SSH_SCP_UP','SSH_X11','SSH_REVERSE_TCPIP','SSH_DIRECT_TCPIP','SSH_REVERSE_UNIXSOCK','SSH_DIRECT_UNIXSOCK','SFTP_SESSION']};const log=(m,t='i')=>{const b=document.getElementById('log-box'),c=t==='e'?'#ff7675':(t==='o'?'#55efc4':'#fff');b.innerHTML+=`<div style="color:${c}">[${new Date().toLocaleTimeString()}] ${m}</div>`;b.scrollTop=b.scrollHeight};const closeModal=()=>document.getElementById('modal').style.display='none';const val=(f,v,allN,curI)=>{if(!/^[ -~]*$/.test(v))return"Invalid characters";const forb=/[/:*?\"<>|@\s]/;if((f==='device_name'||f==='alias'||f==='service_name')&&forb.test(v))return`Invalid char: ${v.match(forb)[0]}`;if(f==='device_name'){if(!v.trim())return"Required";if(allN.filter((n,idx)=>n===v&&idx!==curI).length>0)return"Duplicate Name"}if(f==='host'){if(!v.trim())return"Required";if(!/^(\d{1,3}\.){3}\d{1,3}(\/\d{1,2})?$/.test(v)&&!/^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$/i.test(v))return"Invalid IP/FQDN"}return null};const getClean=(d)=>JSON.parse(JSON.stringify(d,(k,v)=>k==='_deleted'||k==='_isNew'?undefined:v));async function fetchData(){const u=document.getElementById('url').value.replace(/\/$/,''),a=btoa(document.getElementById('usr').value+':'+document.getElementById('pwd').value);log("Connecting...");try{const[rD,rP]=await Promise.all([fetch(`${u}/api/devices/?limit=-1`,{headers:{'Authorization':`Basic ${a}`}}),fetch(`${u}/api/connectionpolicies/?limit=-1`,{headers:{'Authorization':`Basic ${a}`}})]);if(!rD.ok)return log(`Devices fetch failed: ${rD.status}`,'e');if(!rP.ok)return log(`Policies fetch failed: ${rP.status}`,'e');const dData=await rD.json();const pData=await rP.json();devices=dData.value||dData;policies=pData.value||pData;devices.forEach(d=>d.services.forEach(s=>s.subprotocols=s.subprotocols||[]));original=JSON.parse(JSON.stringify(devices));render();document.getElementById('ui').style.display='block';log(`Loaded ${devices.length} devices and ${policies.length} policies.`,'o')}catch(e){log("Error: "+e.message,'e')}}function render(){const container=document.getElementById('device-container'),allNames=devices.map(d=>d.device_name);container.innerHTML=devices.map((d,i)=>{const isMod=JSON.stringify(getClean(d))!==JSON.stringify(getClean(original[i]));const sorted=[...d.services].sort((a,b)=>{if(!!a._isNew!==!!b._isNew)return a._isNew?1:-1;const p={'RDP':1,'SSH':2};return(p[a.protocol]||3)-(p[b.protocol]||3)});return `<div class="device-card ${isMod?'mod-card':''}" id="card-${i}"><div class="card-row">${rf(i,'device_name','Name',d.device_name,allNames,true)}${rf(i,'host','IP or Subnet or FQDN',d.host,allNames,true)}</div><div class="card-row">${rf(i,'alias','Alias',d.alias||'',allNames,false)}${rf(i,'description','Description',d.description||'',allNames,false)}</div><div class="services-area"><div style="font-size:11px;font-weight:bold;margin-bottom:8px;display:flex;align-items:center">SERVICES<button class="add-btn-small" onclick="initAddSvc(${i})">+ Add Service</button></div><div class="services-list">${sorted.map(s=>rs(i,d.services.indexOf(s),s)).join('')}</div></div></div>`}).join('')}function rf(i,f,l,v,allN,hi){const err=val(f,v,allN,i),isD=v!==(original[i][f]||'');return `<div class="field-group"><label class="${hi?'label-highlight':''}">${l}</label><div class="input-wrap"><input type="text" value="${v}" oninput="ud(${i},'${f}',this)" style="border-color:${err?'#e74c3c':'#ced4da'}"><span class="rev-btn" style="visibility:${isD?'visible':'hidden'}" onclick="rd(${i},'${f}')">↺</span></div><span class="hint" style="color:${err?'#e74c3c':''}">${err||''}</span></div>`}function rs(i,si,s){const os=original[i].services.find(x=>x.id===s.id)||{subprotocols:[],port:0,is_dummy:true};const isMod=(s._isNew||s.port!==os.port||JSON.stringify([...s.subprotocols].sort())!==JSON.stringify([...os.subprotocols].sort()))&&!s._deleted;const subs=SUB_MAP[s.protocol]||[],isL=['RDP','SSH'].includes(s.protocol);return `<div class="service-item ${s._deleted?'deleted':''} ${isMod?'mod-svc':''} ${isL?'is-large':''}"><div class="content-mask" style="display:flex;flex-direction:column;flex:1"><div class="svc-info-row"><span>🏷️ <b>Service Name:</b> ${s.service_name}</span><span>🛡️ <b>Connection Policy:</b> ${s.connection_policy||'Default'}</span></div><div style="display:flex;gap:15px;align-items:flex-end;margin-bottom:12px"><div class="field-group" style="flex:none"><label>Protocol</label><div class="input-wrap" style="font-size:13px;font-weight:bold;color:#2c3e50">🔌 ${s.protocol}</div></div><div class="field-group" style="flex:none"><label>Port</label><div class="input-wrap"><input type="number" class="port-input" value="${s.port}" oninput="up(${i},${si},this)"><span class="rev-btn" style="visibility:${s.port!==os.port&&!s._isNew?'visible':'hidden'}" onclick="rp(${i},${si})">↺</span></div></div></div>${isL?`<div class="field-group"><label style="display:flex;justify-content:flex-start;gap:15px">Sub-Protocols<span class="rev-btn" style="visibility:${JSON.stringify([...s.subprotocols].sort())!==JSON.stringify([...os.subprotocols].sort())&&!s._isNew?'visible':'hidden'}" onclick="rsb(${i},${si})">↺</span></label><div class="sub-grid">${s.protocol==='RDP'?'<label><input type="checkbox" checked disabled><span>RDP</span></label>':''}${subs.map(b=>`<label><input type="checkbox" ${(s.subprotocols||[]).includes(b)?'checked':''} onchange="usb(${i},${si},'${b}',this.checked,this)"><span>${b.replace(s.protocol+'_','')}</span></label>`).join('')}</div></div>`:''}</div><button style="margin-top:auto;width:100%;background:${s._deleted?'#2d3436':'#e74c3c'};color:#fff;font-size:11px;border-radius:6px;height:30px;min-height:30px" onclick="ts(${i},${si})">${s._deleted?'UNDO DELETE':'Delete Service'}</button></div>`}function ud(i,f,e){const v=e.value;devices[i][f]=v;const err=val(f,v,devices.map(d=>d.device_name),i);e.style.borderColor=err?'#e74c3c':'#ced4da';const hint=e.parentElement.nextElementSibling;hint.innerText=err||"";hint.style.color=err?'#e74c3c':'';e.nextElementSibling.style.visibility=v!==(original[i][f]||'')?'visible':'hidden';const card=document.getElementById(`card-${i}`);if(JSON.stringify(getClean(devices[i]))!==JSON.stringify(getClean(original[i])))card.classList.add('mod-card');else card.classList.remove('mod-card')}function rd(i,f){devices[i][f]=original[i][f];render()}function up(i,si,e){const v=parseInt(e.value)||0;devices[i].services[si].port=v;const os=original[i].services.find(x=>x.id===devices[i].services[si].id)||{port:0};e.nextElementSibling.style.visibility=v!==os.port&&!devices[i].services[si]._isNew?'visible':'hidden';const item=e.closest('.service-item'),s=devices[i].services[si];if((s._isNew||v!==os.port||JSON.stringify([...s.subprotocols].sort())!==JSON.stringify([...os.subprotocols].sort()))&&!s._deleted)item.classList.add('mod-svc');else item.classList.remove('mod-svc');const card=document.getElementById(`card-${i}`);if(JSON.stringify(getClean(devices[i]))!==JSON.stringify(getClean(original[i])))card.classList.add('mod-card');else card.classList.remove('mod-card')}function rp(i,si){const os=original[i].services.find(x=>x.id===devices[i].services[si].id);devices[i].services[si].port=os.port;render()}function usb(i,si,b,c,el){let s=devices[i].services[si];if(s.protocol==='SSH'&&!c&&s.subprotocols.length===1){el.checked=true;return alert("SSH must have one subprotocol.")}if(c){if(!s.subprotocols.includes(b))s.subprotocols.push(b)}else{s.subprotocols=s.subprotocols.filter(x=>x!==b)}render()}function rsb(i,si){const os=original[i].services.find(x=>x.id===devices[i].services[si].id);devices[i].services[si].subprotocols=JSON.parse(JSON.stringify(os.subprotocols));render()}function ts(i,si){if(devices[i].services[si]._isNew){if(confirm("Permanently remove this unsaved service?")){devices[i].services.splice(si,1);render()}return}devices[i].services[si]._deleted=!devices[i].services[si]._deleted;render()}function initAddSvc(i){activeDevIdx=i;document.getElementById('new-svc-proto').value='';document.getElementById('new-svc-name').value='';document.getElementById('new-svc-port').value='';updateAddModal();document.getElementById('add-svc-modal').style.display='block'}function updateAddModal(){const p=document.getElementById('new-svc-proto').value;const polSel=document.getElementById('new-svc-policy');const portIn=document.getElementById('new-svc-port');polSel.innerHTML='';if(!p){polSel.innerHTML='<option>Select Protocol First</option>';portIn.value='';return}const rel=policies.filter(x=>x.protocol===p);if(rel.length===0)polSel.innerHTML='<option value="">No Policies Found (Using Default)</option>';else rel.forEach(x=>{const op=document.createElement('option');op.value=x.connection_policy_name;op.innerText=x.connection_policy_name;polSel.appendChild(op)});const ports={'SSH':22,'RDP':3389,'TELNET':23,'VNC':5900,'RLOGIN':513};portIn.value=ports[p]||0}function confirmAddService(){const p=document.getElementById('new-svc-proto').value;const n=document.getElementById('new-svc-name').value;const pol=document.getElementById('new-svc-policy').value;const port=parseInt(document.getElementById('new-svc-port').value);if(!p)return alert("Protocol required");const err=val('service_name',n,[],-1);if(err)return alert(err);if(!n.trim())return alert("Name required");if(devices[activeDevIdx].services.some(s=>s.service_name===n))return alert("Service name exists on this device");if(isNaN(port)||port<1||port>65535)return alert("Invalid port");let subs=[];if(p==='SSH')subs=['SSH_SHELL_SESSION'];if(p==='RDP')subs=[];devices[activeDevIdx].services.push({id: 'new_'+Date.now(),service_name: n,protocol: p,port: port,connection_policy: pol,subprotocols: subs,_isNew: true});document.getElementById('add-svc-modal').style.display='none';render()}function openReview(){const allN=devices.map(d=>d.device_name);let errs=[];for(let i=0;i<devices.length;i++){const d=devices[i],o=original[i];for(let f of['device_name','alias','host','description']){const e=val(f,d[f]||'',allN,i);if(e)errs.push(`Device: "${o.device_name}" -> Field: ${f.toUpperCase()} -> Error: ${e}`)}for(let s of d.services)if(!s._deleted&&(s.port<1||s.port>65535))errs.push(`Device: "${o.device_name}" -> Svc: "${s.service_name}" -> Error: Invalid Port`)}if(errs.length>0)return alert("Fix errors:\n\n"+errs.join('\n'));let h='<ul>',c=false;devices.forEach((d,i)=>{const hasDel=d.services.some(s=>s._deleted);if(hasDel||JSON.stringify(getClean(d))!==JSON.stringify(getClean(original[i]))){c=true;h+=`<li><b>${original[i].device_name}</b></li>`}});if(!c)return alert("No changes.");document.getElementById('review-list').innerHTML=h+'</ul>';document.getElementById('modal').style.display='block'}async function processSync(){closeModal();const u=document.getElementById('url').value.replace(/\/$/,''),a=btoa(document.getElementById('usr').value+':'+document.getElementById('pwd').value);for(let i=0;i<devices.length;i++){const d=devices[i],o=original[i];try{if(JSON.stringify(getClean(d))!==JSON.stringify(getClean(o))){log(`Syncing: ${o.device_name}...`);const rD=await fetch(`${u}/api/devices/${o.id}`,{method:'PUT',headers:{'Authorization':`Basic ${a}`,'Content-Type':'application/json'},body:JSON.stringify({device_name:d.device_name,alias:d.alias,description:d.description,host:d.host})});if(!rD.ok){const ed=await rD.json().catch(()=>({}));log(`Device Error: ${ed.description||rD.statusText}`,'e')}}for(let si=0;si<d.services.length;si++){const s=d.services[si],os=o.services.find(x=>x.id===s.id);if(s._isNew){log(`Creating Service: ${s.service_name}...`);let body={service_name:s.service_name,protocol:s.protocol,port:s.port,connection_policy:s.connection_policy};if(['RDP','SSH'].includes(s.protocol))body.subprotocols=s.subprotocols;const rN=await fetch(`${u}/api/devices/${o.id}/services`,{method:'POST',headers:{'Authorization':`Basic ${a}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!rN.ok){const ed=await rN.json().catch(()=>({}));log(`Create Svc ${s.service_name} Error: ${ed.description||rN.statusText}`,'e')}else log(`Svc ${s.service_name} Created.`,'o')}else if(s._deleted){const rDel=await fetch(s.url,{method:'DELETE',headers:{'Authorization':`Basic ${a}`}});if(!rDel.ok){const ed=await rDel.json().catch(()=>({}));log(`Svc ${s.service_name} Delete Error: ${ed.description||rDel.statusText}`,'e')}else log(`Svc ${s.service_name} Deleted.`,'o')}else if(JSON.stringify(s)!==JSON.stringify(os)){let body={port:s.port};if(['RDP','SSH'].includes(s.protocol))body.subprotocols=s.subprotocols;const rS=await fetch(s.url+'?force=true',{method:'PUT',headers:{'Authorization':`Basic ${a}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!rS.ok){const ed=await rS.json().catch(()=>({}));log(`Svc ${s.service_name} Update Error: ${ed.description||rS.statusText}`,'e')}else log(`Svc ${s.service_name} Updated.`,'o')}}}catch(e){log(`System Error: ${e.message}`,'e')}}log("Sync Finished.",'o');fetchData()}</script></body></html>
